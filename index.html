      .scroll-container {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch; 
        scrollbar-width: none;
      }
      .scroll-container::-webkit-scrollbar { display: none; }

      * {
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
      }

      input, textarea {
        font-size: 16px !important; 
      }
